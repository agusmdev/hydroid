# hydroid's knowledge about functions whose bodies it does not (or must not) analyze.
#
# Names are *defining* qualified names: the module where the function is defined, not where it is
# re-exported (`requests.get` is defined as `requests.api.get`). Stdlib names follow typeshed.
# `*` matches within one dotted segment: `requests.sessions.Session.*`.
# `tests/catalog.rs` checks that every name resolves in the fixture environment.

# ---------------------------------------------------------------------------------------------
# Blocking functions. A call to one of these on the event loop is a diagnostic.
# A call whose result is awaited is never blocking (dual sync/async APIs share definitions).
# ---------------------------------------------------------------------------------------------

[[sink]]
category = "sleep"
advice = "use `await asyncio.sleep(...)`"
functions = ["time.sleep"]

[[sink]]
category = "http"
advice = "use an async client (`httpx.AsyncClient`, `aiohttp`) or `await asyncio.to_thread(...)`"
functions = [
    "requests.api.*",
    "requests.sessions.Session.get",
    "requests.sessions.Session.options",
    "requests.sessions.Session.head",
    "requests.sessions.Session.post",
    "requests.sessions.Session.put",
    "requests.sessions.Session.patch",
    "requests.sessions.Session.delete",
    "requests.sessions.Session.request",
    "requests.sessions.Session.send",
    "httpx._api.*",
    "httpx._client.Client.get",
    "httpx._client.Client.options",
    "httpx._client.Client.head",
    "httpx._client.Client.post",
    "httpx._client.Client.put",
    "httpx._client.Client.patch",
    "httpx._client.Client.delete",
    "httpx._client.Client.request",
    "httpx._client.Client.send",
    "httpx._client.Client.stream",
    "urllib.request.urlopen",
    "urllib.request.urlretrieve",
    "urllib.request.OpenerDirector.open",
    "http.client.HTTPConnection.request",
    "http.client.HTTPConnection.getresponse",
    "http.client.HTTPConnection.connect",
    "urllib3.poolmanager.PoolManager.urlopen",
    "urllib3._request_methods.RequestMethods.request",
]

