# ---------------------------------------------------------------------------------------------
# Work moved off the event loop. Callables passed to these run in a worker thread or process:
# hydroid never follows them, and never follows the bodies of these functions.
# ---------------------------------------------------------------------------------------------
[offload]
functions = [
    "asyncio.threads.to_thread",
    "asyncio.events.AbstractEventLoop.run_in_executor",
    "starlette.concurrency.run_in_threadpool",
    "starlette.concurrency.iterate_in_threadpool",
    "starlette.concurrency.run_until_first_complete",
    "anyio.to_thread.run_sync",
    "anyio.to_process.run_sync",
    "concurrent.futures._base.Executor.submit",
    "concurrent.futures._base.Executor.map",
    "threading.Thread.__init__",
    "multiprocessing.process.BaseProcess.__init__",
]

# ---------------------------------------------------------------------------------------------
# Logging calls that hand the record to the filters and handlers attached to the loggers, on the
# calling thread (`Logger._log -> handle -> callHandlers -> Handler.handle -> filter / emit`).
# The `filter`, `emit` and `format` overrides of the project's `logging.Filter`,
# `logging.Handler` and `logging.Formatter` subclasses (and the I/O of the stdlib handlers above)
# run there, for records at or above the logger and handler levels the project sets. `debug` is
# left out: below the levels applications run with, it returns before any filter or handler runs.
# ---------------------------------------------------------------------------------------------
[log_dispatch]
functions = [
    "logging.Logger.info",
    "logging.Logger.warning",
    "logging.Logger.warn",
    "logging.Logger.error",
    "logging.Logger.exception",
    "logging.Logger.critical",
    "logging.Logger.log",
    "logging.LoggerAdapter.info",
    "logging.LoggerAdapter.warning",
    "logging.LoggerAdapter.warn",
    "logging.LoggerAdapter.error",
    "logging.LoggerAdapter.exception",
    "logging.LoggerAdapter.critical",
    "logging.LoggerAdapter.log",
    "logging.info",
    "logging.warning",
    "logging.warn",
    "logging.error",
    "logging.exception",
    "logging.critical",
    "logging.log",
]

# ---------------------------------------------------------------------------------------------
# What functions do with their arguments, in the thread calling them (stub and library bodies are
# not analyzed). A class stands for constructing it. Slots are a position (0: the first argument
# after `self`), a keyword, or "*" (every positional argument not in `calls`).
#   calls     callables given there are called during the call
#   iterates  iterables given there are iterated during the call
#   enters    context managers given there are entered and exited
#   methods   methods called on the first positional argument
#   lazy      the call returns a lazy iterator over what `iterates` names: iterating it iterates
#             those, and `calls` runs where it is consumed (in a worker thread when it is
#             consumed there, see `[offload]`)
# ---------------------------------------------------------------------------------------------
[[arguments]]
iterates = ["*"]
functions = [
    "builtins.list",
    "builtins.tuple",
    "builtins.set",
    "builtins.frozenset",
    "builtins.dict",
    "builtins.sum",
    "builtins.any",
    "builtins.all",
    "builtins.next",
    "builtins.*.join",
    "builtins.*.extend",
    "builtins.*.update",
]

[[arguments]]
iterates = ["*"]
calls = ["key"]
functions = ["builtins.sorted", "builtins.min", "builtins.max"]

[[arguments]]
calls = ["key"]
functions = ["builtins.list.sort"]

[[arguments]]
calls = [0]
iterates = [1]
functions = ["functools.reduce"]

[[arguments]]
calls = [0]
functions = ["_contextvars.Context.run", "contextlib._BaseExitStack.callback"]

[[arguments]]
calls = [0]
iterates = ["*"]
lazy = true
functions = ["builtins.map", "builtins.filter"]

[[arguments]]
iterates = ["*"]
lazy = true
functions = ["builtins.zip", "builtins.enumerate", "builtins.reversed"]

# `iter(x)` only calls `x.__iter__()`: a generator `__iter__` (like a generator function) creates
# its generator, whose body runs when the result is advanced (`next`, `for`), maybe in a worker
# thread (`to_thread(next, it)`).
[[arguments]]
iterates = [0]
methods = ["__iter__"]
lazy = true
functions = ["builtins.iter"]

[[arguments]]
methods = ["__len__"]
functions = ["builtins.len"]

[[arguments]]
enters = [0]
functions = ["contextlib._BaseExitStack.enter_context"]

[[arguments]]
methods = ["close"]
functions = ["contextlib.closing"]

# The same for a third-party library, sortedcontainers: the sorted collections iterate the
# iterable they are built from and call `key` on every element.
# [[arguments]]
# iterates = [0, "iterable"]
# calls = [1, "key"]
# functions = [
#     "sortedcontainers.sortedlist.SortedList",
#     "sortedcontainers.sortedlist.SortedKeyList",
#     "sortedcontainers.sortedset.SortedSet",
# ]
#
# [[arguments]]
# iterates = ["*"]
# functions = ["sortedcontainers.sortedlist.SortedList.update", "sortedcontainers.sortedset.SortedSet.update"]

# ---------------------------------------------------------------------------------------------
# Callables passed to these are only inspected (name, signature, docstring), never called: a
# decorator's `@functools.wraps(func)` does not make its wrapper call `func`.
# ---------------------------------------------------------------------------------------------
[inspects]
functions = [
    "functools.wraps",
    "functools.update_wrapper",
    "inspect.signature",
    "inspect.iscoroutinefunction",
    "asyncio.coroutines.iscoroutinefunction",
]

# Field declarations in a class body: constructing the class without giving the field calls the
# callable given at `factory` (constructs the class given there), and the field can also be given
# by the string literals given at `names`.
[[arguments]]
factory = ["default_factory"]
names = ["alias", "validation_alias"]
functions = ["pydantic.fields.Field", "sqlmodel.main.Field"]

[[arguments]]
factory = ["default_factory"]
functions = ["dataclasses.field"]

# The same for other libraries: attrs (`attrs.field(factory=f, alias="x")`, its stubs define it in
# `attrs`) and msgspec (`msgspec.field(default_factory=f, name="x")`).
# [[arguments]]
# factory = ["factory"]
# names = ["alias"]
# functions = ["attrs.field", "attr.attrib"]
#
# [[arguments]]
# factory = ["default_factory"]
# names = ["name"]
# functions = ["msgspec.field"]

# ---------------------------------------------------------------------------------------------
# Model hooks: methods, and callables attached to fields, that validating or dumping a model runs
# (inside pydantic-core, which no analysis can follow).
#   [[hook]]        what makes a function a hook of its class: a decorator; or (with `callable`)
#                   a class or function whose call in the `Annotated[...]` metadata of a field
#                   attaches the callable given at that slot to the field
#     runs          "validation" (constructing an instance or validating data into the class) or
#                   "dump"
#     fields        "arguments" (the fields the decorator's call names; "*": every field) or
#                   "name" (the field named like the decorated function); default: every field
#     json_only     { keyword, values }: a dump hook only runs for JSON dumps when its call gives
#                   the keyword one of these literal values
#   [[runs_hooks]]  operations running the hooks of the class they are called on (a class
#                   object, or an instance)
#     runs          "validation" (like constructing it, from any data) or "dump"
#     json          a dump to JSON
#     json_unless   { keyword, values }: when the call gives the keyword, the dump is to JSON
#                   unless its literal value is one of these
#     exclude       keyword naming (in a literal set or dict) the top-level fields left out
#     include       keyword naming the only top-level fields dumped
# ---------------------------------------------------------------------------------------------
[[hook]]
runs = "validation"
functions = [
    "pydantic.functional_validators.field_validator",
    "pydantic.functional_validators.model_validator",
    "pydantic.deprecated.class_validators.validator",
    "pydantic.deprecated.class_validators.root_validator",
]

[[hook]]
runs = "dump"
fields = "arguments"
json_only = { keyword = "when_used", values = ["json", "json-unless-none"] }
functions = ["pydantic.functional_serializers.field_serializer"]

[[hook]]
runs = "dump"
json_only = { keyword = "when_used", values = ["json", "json-unless-none"] }
functions = ["pydantic.functional_serializers.model_serializer"]

[[hook]]
runs = "dump"
fields = "name"
functions = ["pydantic.fields.computed_field"]

# `Annotated[T, AfterValidator(f)]`; annotated-types' `Predicate(f)` and `Not(f)`, which pydantic
# runs as validators too.
[[hook]]
runs = "validation"
callable = [0, "func"]
functions = [
    "pydantic.functional_validators.AfterValidator",
    "pydantic.functional_validators.BeforeValidator",
    "pydantic.functional_validators.PlainValidator",
    "pydantic.functional_validators.WrapValidator",
    "annotated_types.Predicate",
    "annotated_types.Not",
]

[[hook]]
runs = "dump"
callable = [0, "func"]
json_only = { keyword = "when_used", values = ["json", "json-unless-none"] }
functions = ["pydantic.functional_serializers.PlainSerializer", "pydantic.functional_serializers.WrapSerializer"]

[[runs_hooks]]
runs = "validation"
functions = [
    "pydantic.main.BaseModel.model_validate",
    "pydantic.main.BaseModel.model_validate_json",
    "pydantic.main.BaseModel.model_validate_strings",
    "pydantic.main.BaseModel.parse_obj",
    "pydantic.main.BaseModel.parse_raw",
    "sqlmodel.main.SQLModel.model_validate",
    "sqlmodel.main.SQLModel.parse_obj",
]

[[runs_hooks]]
runs = "dump"
json = true
exclude = "exclude"
include = "include"
