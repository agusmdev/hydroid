# ---------------------------------------------------------------------------------------------
# Functions raising `raises` when no event loop runs in the calling thread. The handlers that
# catch it (or one of its bases) of a `try` doing nothing but call these never run on the loop:
# sync helpers shared by loop code and worker threads fall back to blocking work there.
# ---------------------------------------------------------------------------------------------
[[loop_probe]]
raises = "builtins.RuntimeError"
functions = ["_asyncio.get_running_loop"]

# The same for a third-party library, sniffio:
# [[loop_probe]]
# raises = "sniffio._impl.AsyncLibraryNotFoundError"
# functions = ["sniffio._impl.current_async_library"]

# ---------------------------------------------------------------------------------------------
# Sync callables passed to these run *on* the event loop.
# ---------------------------------------------------------------------------------------------
[loop_callback]
functions = [
    "asyncio.events.AbstractEventLoop.call_soon",
    "asyncio.events.AbstractEventLoop.call_soon_threadsafe",
    "asyncio.events.AbstractEventLoop.call_later",
    "asyncio.events.AbstractEventLoop.call_at",
    "asyncio.events.AbstractEventLoop.add_reader",
    "asyncio.events.AbstractEventLoop.add_writer",
    "asyncio.events.AbstractEventLoop.add_signal_handler",
    "_asyncio.Future.add_done_callback",
]

# ---------------------------------------------------------------------------------------------
# FastAPI / Starlette entry points: used to show which endpoint reaches a diagnostic.
#   kind               what is registered ("route", "dependency", "middleware", ...)
#   slot               the parameters taking the callable (or class) registered; a decorator
#                      registers what it decorates. Without it, any argument.
#   validates_params   the framework validates, on the loop, the annotated parameters of what is
#                      registered (of its `__init__`, for a class) from the request
#   serializes_return  the framework dumps what it returns on the loop (sync callables included)
#   validates_return   the framework validates what it returns into the response model in the
#                      thread the callable runs in (the loop for an `async def`)
#   response_model     the keyword giving the response model (`None`: no model); the return
#                      annotation otherwise
#   response_exclude   the keyword naming top-level fields left out of the dump
#   passthrough        classes sent as they are: a callable always returning instances of them
#                      has its return value neither validated nor dumped
#   injects            a parameter whose default (or `Annotated` metadata) is a call to these is
#                      filled with what the callable at `slot` provides, not from the request
# ---------------------------------------------------------------------------------------------
[[entry]]
kind = "route"
slot = ["endpoint"]
validates_params = true
serializes_return = true
validates_return = true
response_model = "response_model"
response_exclude = "response_model_exclude"
passthrough = ["starlette.responses.Response"]
functions = [
    "fastapi.applications.FastAPI.get",
    "fastapi.applications.FastAPI.put",
    "fastapi.applications.FastAPI.post",
    "fastapi.applications.FastAPI.delete",
    "fastapi.applications.FastAPI.options",
    "fastapi.applications.FastAPI.head",
    "fastapi.applications.FastAPI.patch",
    "fastapi.applications.FastAPI.trace",
    "fastapi.applications.FastAPI.api_route",
    "fastapi.applications.FastAPI.add_api_route",
    "fastapi.routing.APIRouter.get",
    "fastapi.routing.APIRouter.put",
    "fastapi.routing.APIRouter.post",
    "fastapi.routing.APIRouter.delete",
    "fastapi.routing.APIRouter.options",
    "fastapi.routing.APIRouter.head",
    "fastapi.routing.APIRouter.patch",
    "fastapi.routing.APIRouter.trace",
    "fastapi.routing.APIRouter.api_route",
    "fastapi.routing.APIRouter.add_api_route",
    "fastapi.routing.APIRoute.__init__",
]

# Starlette passes the request as is, and sends what the endpoint returns as is.
[[entry]]
kind = "route"
slot = ["endpoint"]
functions = ["starlette.routing.Route.__init__", "starlette.applications.Starlette.add_route"]

[[entry]]
kind = "websocket"
slot = ["endpoint"]
validates_params = true
functions = [
    "fastapi.applications.FastAPI.websocket",
    "fastapi.applications.FastAPI.add_api_websocket_route",
    "fastapi.routing.APIRouter.websocket",
    "fastapi.routing.APIRouter.add_api_websocket_route",
]

[[entry]]
kind = "websocket"
slot = ["endpoint"]
functions = ["starlette.routing.WebSocketRoute.__init__"]

