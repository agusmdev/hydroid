    "threading.Thread.__init__",
    "multiprocessing.process.BaseProcess.__init__",
]

# ---------------------------------------------------------------------------------------------
# Logging calls that hand the record to the filters and handlers attached to the loggers, on the
# calling thread (`Logger._log -> handle -> callHandlers -> Handler.handle -> filter / emit`).
# The `filter`, `emit` and `format` overrides of the project's `logging.Filter`,
# `logging.Handler` and `logging.Formatter` subclasses (and the I/O of the stdlib handlers above)
# run there, for records at or above the logger and handler levels the project sets. `debug` is
# left out: below the levels applications run with, it returns before any filter or handler runs.
# ---------------------------------------------------------------------------------------------
[log_dispatch]
functions = [
    "logging.Logger.info",
    "logging.Logger.warning",
    "logging.Logger.warn",
    "logging.Logger.error",
    "logging.Logger.exception",
    "logging.Logger.critical",
    "logging.Logger.log",
    "logging.LoggerAdapter.info",
    "logging.LoggerAdapter.warning",
    "logging.LoggerAdapter.warn",
    "logging.LoggerAdapter.error",
    "logging.LoggerAdapter.exception",
    "logging.LoggerAdapter.critical",
    "logging.LoggerAdapter.log",
    "logging.info",
    "logging.warning",
    "logging.warn",
    "logging.error",
    "logging.exception",
    "logging.critical",
    "logging.log",
]

# ---------------------------------------------------------------------------------------------
# What functions do with their arguments, in the thread calling them (stub and library bodies are
# not analyzed). A class stands for constructing it. Slots are a position (0: the first argument
# after `self`), a keyword, or "*" (every positional argument not in `calls`).
#   calls     callables given there are called during the call
#   iterates  iterables given there are iterated during the call
#   enters    context managers given there are entered and exited
#   methods   methods called on the first positional argument
#   lazy      the call returns a lazy iterator over what `iterates` names: iterating it iterates
#             those, and `calls` runs where it is consumed (in a worker thread when it is
#             consumed there, see `[offload]`)
# ---------------------------------------------------------------------------------------------
[[arguments]]
iterates = ["*"]
functions = [
    "builtins.list",
    "builtins.tuple",
    "builtins.set",
    "builtins.frozenset",
    "builtins.dict",
    "builtins.sum",
    "builtins.any",
    "builtins.all",
    "builtins.next",
    "builtins.*.join",
    "builtins.*.extend",
    "builtins.*.update",
]

[[arguments]]
iterates = ["*"]
calls = ["key"]
functions = ["builtins.sorted", "builtins.min", "builtins.max"]

[[arguments]]
calls = ["key"]
functions = ["builtins.list.sort"]

[[arguments]]
calls = [0]
iterates = [1]
functions = ["functools.reduce"]

[[arguments]]
calls = [0]
functions = ["_contextvars.Context.run", "contextlib._BaseExitStack.callback"]

[[arguments]]
calls = [0]
iterates = ["*"]
lazy = true
functions = ["builtins.map", "builtins.filter"]

[[arguments]]
iterates = ["*"]
lazy = true
functions = ["builtins.zip", "builtins.enumerate", "builtins.reversed"]

# `iter(x)` only calls `x.__iter__()`: a generator `__iter__` (like a generator function) creates
# its generator, whose body runs when the result is advanced (`next`, `for`), maybe in a worker
# thread (`to_thread(next, it)`).
[[arguments]]
iterates = [0]
methods = ["__iter__"]
lazy = true
functions = ["builtins.iter"]

[[arguments]]
methods = ["__len__"]
functions = ["builtins.len"]

[[arguments]]
enters = [0]
functions = ["contextlib._BaseExitStack.enter_context"]

[[arguments]]
methods = ["close"]
functions = ["contextlib.closing"]

# The same for a third-party library, sortedcontainers: the sorted collections iterate the
# iterable they are built from and call `key` on every element.
# [[arguments]]
# iterates = [0, "iterable"]
# calls = [1, "key"]
# functions = [
#     "sortedcontainers.sortedlist.SortedList",
#     "sortedcontainers.sortedlist.SortedKeyList",
#     "sortedcontainers.sortedset.SortedSet",
# ]
#
# [[arguments]]
# iterates = ["*"]
# functions = ["sortedcontainers.sortedlist.SortedList.update", "sortedcontainers.sortedset.SortedSet.update"]

# ---------------------------------------------------------------------------------------------
# Callables passed to these are only inspected (name, signature, docstring), never called: a
# decorator's `@functools.wraps(func)` does not make its wrapper call `func`.
# ---------------------------------------------------------------------------------------------
[inspects]
functions = [
    "functools.wraps",
    "functools.update_wrapper",
    "inspect.signature",
    "inspect.iscoroutinefunction",
    "asyncio.coroutines.iscoroutinefunction",
]

# ---------------------------------------------------------------------------------------------
# Functions raising `raises` when no event loop runs in the calling thread. The handlers that
# catch it (or one of its bases) of a `try` doing nothing but call these never run on the loop:
# sync helpers shared by loop code and worker threads fall back to blocking work there.
# ---------------------------------------------------------------------------------------------
[[loop_probe]]
raises = "builtins.RuntimeError"
functions = ["_asyncio.get_running_loop"]

# The same for a third-party library, sniffio:
# [[loop_probe]]
# raises = "sniffio._impl.AsyncLibraryNotFoundError"
# functions = ["sniffio._impl.current_async_library"]

# ---------------------------------------------------------------------------------------------
# Sync callables passed to these run *on* the event loop.
# ---------------------------------------------------------------------------------------------
[loop_callback]
functions = [
    "asyncio.events.AbstractEventLoop.call_soon",
    "asyncio.events.AbstractEventLoop.call_soon_threadsafe",
    "asyncio.events.AbstractEventLoop.call_later",
    "asyncio.events.AbstractEventLoop.call_at",
    "asyncio.events.AbstractEventLoop.add_reader",
    "asyncio.events.AbstractEventLoop.add_writer",
    "asyncio.events.AbstractEventLoop.add_signal_handler",
    "_asyncio.Future.add_done_callback",
]

