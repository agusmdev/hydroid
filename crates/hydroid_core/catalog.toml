[[sink]]
# Inside a running loop these raise instead of blocking: only a direct call from loop code is a
# certain bug. Sync helpers reaching them almost always check for a running loop first.
category = "event-loop"
advice = "`await` the coroutine: starting an event loop inside a running one raises `RuntimeError`"
direct = true
functions = [
    "asyncio.runners.run",
    "asyncio.runners.Runner.run",
    "asyncio.events.AbstractEventLoop.run_until_complete",
    "asyncio.events.AbstractEventLoop.run_forever",
]

[[sink]]
category = "retry"
advice = "use `tenacity.AsyncRetrying` / decorate the coroutine, whose waits use `asyncio.sleep`"
functions = ["tenacity.Retrying.__call__", "tenacity.BaseRetrying.__iter__"]

# Calling a sync function decorated with these runs a retry loop that sleeps between attempts.
[[blocking_decorator]]
category = "retry"
advice = "decorate a coroutine instead (tenacity then waits with `asyncio.sleep`), or run the call with `await asyncio.to_thread(...)`"
functions = ["tenacity.retry"]

[[sink]]
category = "cpu"
opt_in = true
advice = "CPU-bound: run it with `await asyncio.to_thread(...)` or in a process pool"
functions = [
    "bcrypt.hashpw",
    "bcrypt.checkpw",
    "bcrypt.kdf",
    "_hashlib.pbkdf2_hmac",
    "_hashlib.scrypt",
]

# ---------------------------------------------------------------------------------------------
# Work moved off the event loop. Callables passed to these run in a worker thread or process:
# hydroid never follows them, and never follows the bodies of these functions.
# ---------------------------------------------------------------------------------------------
[offload]
functions = [
    "asyncio.threads.to_thread",
    "asyncio.events.AbstractEventLoop.run_in_executor",
    "starlette.concurrency.run_in_threadpool",
    "starlette.concurrency.iterate_in_threadpool",
    "starlette.concurrency.run_until_first_complete",
    "anyio.to_thread.run_sync",
    "anyio.to_process.run_sync",
    "concurrent.futures._base.Executor.submit",
    "concurrent.futures._base.Executor.map",
    "threading.Thread.__init__",
    "multiprocessing.process.BaseProcess.__init__",
]

# ---------------------------------------------------------------------------------------------
# Sync callables passed to these run *on* the event loop.
# ---------------------------------------------------------------------------------------------
[loop_callback]
functions = [
    "asyncio.events.AbstractEventLoop.call_soon",
    "asyncio.events.AbstractEventLoop.call_soon_threadsafe",
    "asyncio.events.AbstractEventLoop.call_later",
    "asyncio.events.AbstractEventLoop.call_at",
    "asyncio.events.AbstractEventLoop.add_reader",
    "asyncio.events.AbstractEventLoop.add_writer",
    "asyncio.events.AbstractEventLoop.add_signal_handler",
    "_asyncio.Future.add_done_callback",
]

