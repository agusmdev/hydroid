name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels its older run; every push to main runs.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          components: clippy, rustfmt
      - uses: astral-sh/setup-uv@v6
        with:
          cache-dependency-glob: tests/fixtures/uv.lock
      # One cache for this job and release.yml's `checks`, saved only from main: a cache per
      # branch fills the repository's 10 GB cache quota.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --profile ci
