# Every push to main updates the release PR (version bump + CHANGELOG.md, from Conventional
# Commit titles). Merging that PR tags vX.Y.Z and creates the GitHub release; the same run then
# tests, builds wheels for every platform, publishes them to PyPI through Trusted Publishing
# (after approval in the `pypi` environment) and attaches them to the GitHub release.
# Everything stays in this one workflow: tags made with GITHUB_TOKEN don't trigger other
# workflows, and PyPI trusts this file by name.
# Pull requests that touch packaging build the wheels without publishing; so does a manual run.
name: Release

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - pyproject.toml
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4

  checks:
    needs: release-please
    if: ${{ !cancelled() && (needs.release-please.outputs.created == 'true' || github.event_name != 'push') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          components: clippy
      - uses: astral-sh/setup-uv@v6
      - uses: Swatinem/rust-cache@v2
      - name: Tag matches the workspace version
        if: needs.release-please.outputs.created == 'true'
        run: |
          version=$(cargo metadata --no-deps --locked --format-version 1 \
            | jq -r '.packages[] | select(.name == "hydroid") | .version')
          test "v$version" = "${{ needs.release-please.outputs.tag }}"
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  wheels:
    needs: checks
    if: ${{ !cancelled() && needs.checks.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto, smoke: true }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: auto, smoke: true }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2 }
          - { os: macos-latest, target: aarch64, smoke: true }
          - { os: macos-latest, target: x86_64 }
          - { os: windows-latest, target: x64, smoke: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist
      - if: matrix.smoke
        uses: astral-sh/setup-uv@v6
      - name: Smoke test the wheel
        if: matrix.smoke
        shell: bash
        run: uvx --no-index --find-links dist --from hydroid-cli hydroid --version
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
          path: dist

  sdist:
    needs: checks
    if: ${{ !cancelled() && needs.checks.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  publish:
    needs: [release-please, wheels, sdist]
    if: ${{ !cancelled() && needs.release-please.outputs.created == 'true' && needs.wheels.result == 'success' && needs.sdist.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hydroid-cli
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [release-please, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release upload "${{ needs.release-please.outputs.tag }}" dist/* --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}
