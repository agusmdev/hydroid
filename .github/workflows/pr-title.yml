# Pull requests are squash-merged, so the title becomes the commit on main that release-please
# reads: it must be a Conventional Commit (`feat: ...`, `fix(scope): ...`, `feat!: ...`).
name: PR title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ github.token }}
